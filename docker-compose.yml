services:
  postgres:
    image: postgres:16-alpine
    container_name: mortgage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mortgage_underwriting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mortgage_underwriting}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mortgage-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mortgage-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Mortgage Underwriting AI}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mortgage_underwriting}
      STORAGE_BASE_PATH: /app/storage
      STORAGE_UPLOADS_PATH: /app/storage/uploads
      STORAGE_PROCESSED_PATH: /app/storage/processed
      STORAGE_REPORTS_PATH: /app/storage/reports
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mortgage-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mortgage-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - mortgage-network

volumes:
  postgres_data:
    driver: local

networks:
  mortgage-network:
    driver: bridge
